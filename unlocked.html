<!DOCTYPE html>
<!-- ============================================================
     TalkTukTuk — unlocked.html
     ============================================================
     Purpose: Set this page as the "Return URL" / "Success URL"
     inside your ABA PayWay Payment Link settings. After a
     successful payment, ABA redirects the customer here, this
     page unlocks Premium in their browser, then sends them back
     into the app.

     Upload this file to the same GitHub Pages repo as index.html
     (same folder level), so the redirect below points to the
     right place.
     ============================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful — TalkTukTuk</title>

  <!-- Prevents this page from being indexed by search engines -->
  <meta name="robots" content="noindex, nofollow" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .success-box {
      max-width: 360px;
    }

    .checkmark {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px;
      color: #111;
    }

    p {
      font-size: 15px;
      color: #555;
      margin: 0;
    }

    .spinner {
      margin-top: 20px;
      width: 24px;
      height: 24px;
      border: 3px solid #ddd;
      border-top-color: #e6262c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: auto;
      margin-right: auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="success-box">
    <div class="checkmark">✅</div>
    <h1>Payment Successful!</h1>
    <p>Unlocking your 160 Premium phrases...</p>
    <div class="spinner"></div>
  </div>

  <script>
    (function () {
      // ------------------------------------------------------------
      // CONFIG — must match the keys used in index.html's lock script
      // ------------------------------------------------------------
      var STORAGE_KEY = "talktuktuk_premium";
      var UNLOCK_VALUE = "unlocked";

      // Where to send the user after unlocking.
      // Change this if index.html isn't at the root of your site.
      var REDIRECT_URL = "index.html";

      // Delay before redirecting, in milliseconds
      var REDIRECT_DELAY_MS = 2000;

      // ------------------------------------------------------------
      // Unlock immediately on page load
      // ------------------------------------------------------------
      try {
        localStorage.setItem(STORAGE_KEY, UNLOCK_VALUE);
      } catch (e) {
        // localStorage can fail in private/incognito or storage-blocked
        // contexts. The user still sees the success message and gets
        // redirected, but may need to re-enter the passcode manually
        // if their browser blocks storage.
        console.warn("TalkTukTuk: couldn't save unlock state:", e);
      }

      // ------------------------------------------------------------
      // Redirect back to the app after a short delay
      // ------------------------------------------------------------
      setTimeout(function () {
        window.location.href = REDIRECT_URL;
      }, REDIRECT_DELAY_MS);
    })();
  </script>

</body>
</html>
